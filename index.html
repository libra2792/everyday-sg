<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F8F6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- route-head: replaced per route at build time (vite.config.ts) and kept current in the app (useDocumentHead) -->
    <title>Everyday SG — Your guide to adulting in Singapore</title>
    <meta name="description" content="Everyday SG — your guide to adulting in Singapore. Plain-English guides, calculators and checklists for money, housing, family, caregiving, insurance, CPF, tax and life admin." />
    <meta property="og:title" content="Everyday SG — Your guide to adulting in Singapore" />
    <meta property="og:description" content="Everyday SG — your guide to adulting in Singapore. Plain-English guides, calculators and checklists for money, housing, family, caregiving, insurance, CPF, tax and life admin." />
    <meta property="og:image" content="/og-image.png" />
    <!-- /route-head -->
    <meta property="og:site_name" content="Everyday SG" />
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved appearance before first paint to avoid a flash of the default theme.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('everydaysg:theme') || 'null');
          var valid = ['sage', 'playful', 'dark', 'professional'];
          var theme = valid.indexOf(saved) !== -1 ? saved : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'sage';
          if (theme !== 'sage') document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
